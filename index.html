<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1115;color:#e6e6e6}
  header{padding:32px 24px 12px;text-align:center}
  header h1{margin:0 0 6px;font-size:28px;letter-spacing:.5px}
  header p{margin:0;color:#8a93a6;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:24px;max-width:1200px;margin:0 auto}
  figure{margin:0;background:#161a22;border-radius:12px;overflow:hidden;border:1px solid #232936;transition:transform .2s;display:flex;flex-direction:column}
  figure:hover{transform:translateY(-3px)}
  figure a{display:block;flex:1}
  figure img{display:block;width:100%;height:100%;aspect-ratio:3/4;object-fit:cover}
  figcaption{padding:12px 16px;font-size:13px;color:#8a93a6;display:flex;justify-content:space-between;align-items:center}
  figcaption .actions{display:flex;align-items:center;gap:8px}
  figcaption a{color:#7aa2f7;text-decoration:none}
  figcaption a:hover{text-decoration:underline}
  .copy-link{border:1px solid #394254;background:#222836;color:#cfd4e0;border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer;white-space:nowrap}
  .copy-link:hover{background:#2b3445;border-color:#53617a}
  .copy-link.copied{color:#8bd49c;border-color:#4d7c59;background:#203127}
  .copy-link.failed{color:#f29d9d;border-color:#874f4f;background:#382525}
  footer{text-align:center;padding:24px;color:#5b6478;font-size:12px}
</style>

<script>
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const input = document.createElement('textarea');
    input.value = text;
    input.setAttribute('readonly', '');
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    const copied = document.execCommand('copy');
    input.remove();
    if (!copied) throw new Error('copy failed');
  }

  document.querySelectorAll('.copy-link').forEach(button => {
    button.addEventListener('click', async () => {
      const imageUrl = new URL(button.dataset.image, window.location.href).href;
      const originalText = button.textContent;
      button.classList.remove('copied', 'failed');
      try {
        await copyText(imageUrl);
        button.textContent = '已复制';
        button.classList.add('copied');
      } catch (error) {
        button.textContent = '复制失败';
        button.classList.add('failed');
      }
      window.setTimeout(() => {
        button.textContent = originalText;
        button.classList.remove('copied', 'failed');
      }, 1600);
    });
  });
</script>
